{% set name = "plasrip" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  skip: true  # [win or osx]

requirements:
  host:
    - python >=3.10,<3.12
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10,<3.12
    - numpy >=1.24
    - pandas >=1.5
    - tqdm >=4.64
    - joblib >=1.2
    - biopython >=1.81
    - openpyxl >=3.1
    - pytorch >=2.0
    - mash =2.3
    - abricate
    - macsyfinder =2.1.4
    - prodigal

test:
  requires:
    - pytest >=7.0
  imports:
    - plasrip
  source_files:
    - tests/
    - scripts/
  commands:
    - plasrip --help
    - plasrip version
    - plasrip models --json
    - python scripts/verify_install.py
    - pytest -q tests/test_import_and_version.py tests/test_cli.py tests/test_install_smoke.py

about:
  home: "https://github.com/changan522/PlasRiP"
  summary: "Plasmid host-range prediction with external PTU/PGG reference database and integrated annotation."
  description: |
    PlasRip is a plasmid analysis platform centered on host-range prediction and
    PTU assignment, with integrated AMR detection, replicon typing, and
    mobility prediction.
  license: MIT
  license_file: LICENSE.txt
  doc_url: "https://github.com/changan522/PlasRiP"
  dev_url: "https://github.com/changan522/PlasRiP"

extra:
  recipe-maintainers:
    - changan522
